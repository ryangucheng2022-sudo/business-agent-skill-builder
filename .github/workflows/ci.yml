# Copy to .github/workflows/ci.yml to enable (see ci/README.md).
name: ci
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: This repo passes its own validator
        run: python scripts/validate_skill.py .
      - name: Negative case (broken skill must fail)
        run: "! python scripts/validate_skill.py ci/broken-skill"
